name: Check

# Every push to main and every pull request:
#
# - `hygiene`: no em or en dashes in any tracked file.
# - `zizmor`: static analysis of these workflows.
# - `gitleaks`: secrets anywhere in the history, not just the tip.
# - `public-hygiene-rules`: the unit tests of the shared public hygiene check
#   (`.github/public-hygiene/`), which every public repository calls.
# - `caller-pin-current`: this repository's own caller pins the newest v* release tag on
#   the base branch (on a pull request), or the checker in this tree (on main).
#
# The first three are required checks in the default branch's ruleset, so a pull request
# cannot merge until they pass. The other two are not (yet) required.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege at the top level, so a job added later starts read-only. Nothing here
# writes.
permissions:
  contents: read

# Per ref and per trigger. Only pull requests cancel in flight: a superseded pull request
# run is waste, a superseded main run is history.
concurrency:
  group: check-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    name: hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pattern is the UTF-8 bytes of U+2013 and U+2014, written as escapes so this
      # file passes its own check, and first run against a planted control, as in
      # homebrew-tap's audit.yml.
      - name: No em or en dashes
        run: |
          set -euo pipefail
          export LC_ALL=C
          pattern='\xe2\x80[\x93\x94]'
          printf 'en \xe2\x80\x93 and em \xe2\x80\x94\n' > "$RUNNER_TEMP/dash-control.txt"
          if ! (cd "$RUNNER_TEMP" && git grep --no-index -qP "$pattern" -- dash-control.txt); then
            echo "::error::The dash pattern no longer matches its planted control."
            exit 1
          fi
          set +e
          git grep -nIP "$pattern"
          status=$?
          set -e
          case "$status" in
            0) echo "::error::Em or en dashes above. Use commas, periods or parentheses."; exit 1 ;;
            1) echo "No em or en dashes in any tracked file." ;;
            *) echo "::error::git grep failed with status $status."; exit "$status" ;;
          esac

  # Annotations mode: zizmor FAILS the job on a finding instead of uploading SARIF.
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.30.1
          advanced-security: false
          annotations: true

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the whole history, not just the tip

      # gitleaks/gitleaks-action needs a paid licence for an organization repository. The
      # CLI is free (MIT); `go install` of a tagged module is checked against the Go
      # checksum database.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: false

      - name: gitleaks git
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git --no-banner --redact -v --log-opts="HEAD" .

  # This repository's own caller (public-text.yml) pins a commit of this repository,
  # named by its v* tag (the `pin` job requires that).
  # - On a pull request: it must pin the newest v* release tag on the base branch. A pull
  #   request that changes the checker cannot pin its own commit (that commit has no tag),
  #   so it keeps the newest tag, and the re-pin follows the merge.
  # - On main: the pinned commit's checker must equal this tree's, so a merged checker
  #   change stays red here until its merge commit is tagged and this caller re-pinned.
  caller-pin-current:
    name: caller-pin-current
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the pinned commit must be present to compare with

      - name: The caller pins the newest tag, or the checker in this tree on main
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          pin=$(grep -oP 'public-hygiene\.yml@\K[0-9a-f]{40}' .github/workflows/public-text.yml)
          if ! git cat-file -e "$pin^{commit}" 2>/dev/null; then
            echo "::error::public-text.yml pins $pin, which is not in this repository's history."
            exit 1
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            # The newest release tag on the base branch: a tag only on another branch, or a
            # pre-release (`v2.0.0-rc1`), is not one. It must have the shape pin.py's
            # TAG_COMMENT accepts.
            latest=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude '*-*' "origin/$GITHUB_BASE_REF" 2>/dev/null) || latest=""
            if ! [[ "$latest" =~ ^v[0-9]{1,6}(\.[0-9]{1,6}){0,2}$ ]] || [ "$(git rev-list -n 1 "$latest")" != "$pin" ]; then
              echo "::error::public-text.yml pins $pin; on a pull request it must pin the newest v* release tag on $GITHUB_BASE_REF (${latest:-none})."
              exit 1
            fi
            echo "public-text.yml pins the newest tag, $latest."
            exit 0
          fi
          if ! git diff --quiet "$pin" HEAD -- .github/public-hygiene .github/workflows/public-hygiene.yml; then
            echo "::error::public-text.yml pins $pin, whose checker differs from this tree. Tag the merge commit and re-pin."
            exit 1
          fi
          echo "public-text.yml pins the checker in this tree."

  public-hygiene-rules:
    name: public-hygiene-rules
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Unit tests
        run: python3 -I -B -m unittest discover -v -s .github/public-hygiene -t .github/public-hygiene
